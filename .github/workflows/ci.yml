name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.10', py: '310', django: '52' }
          - { python: '3.11', py: '311', django: '52' }
          - { python: '3.12', py: '312', django: '52' }
          - { python: '3.12', py: '312', django: '60' }
          - { python: '3.12', py: '312', django: '61' }
          - { python: '3.13', py: '313', django: '52' }
          - { python: '3.13', py: '313', django: '60' }
          - { python: '3.13', py: '313', django: '61' }
          - { python: '3.14', py: '314', django: '52' }
          - { python: '3.14', py: '314', django: '60' }
          - { python: '3.14', py: '314', django: '61' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: python -m pip install 'tox>=4.2'
      - name: Run selected Django environment
        run: python -m tox -e py${{ matrix.py }}-django${{ matrix.django }}

  static:
    name: Pre-commit and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pre-commit pyyaml
      - run: python scripts/check_release_matrix.py
      - run: python scripts/smoke_execution_tracker.py
      - run: python scripts/smoke_components.py
      - run: python scripts/smoke_component_integration.py
      - run: python scripts/smoke_activation_regressions.py
      - run: python scripts/smoke_performance_hardening.py
      - run: pre-commit run --all-files --config=.pre-commit-config-ci.yaml

  docs:
    name: Build Sphinx documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install 'sphinx>=6.2.1,<7' 'sphinx-rtd-theme>=2,<3'
      - name: Build documentation without warnings
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

  package:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    needs: [test, static, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dj-logging-distributions
          path: dist/*
