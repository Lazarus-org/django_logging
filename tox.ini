[tox]
requires =
    tox>=4.2
env_list =
    py314-django{60, 52}
    py313-django{60, 52}
    py312-django{60, 52}
    py311-django{52}
    py310-django{52}

[testenv]
description = Run Pytest tests with multiple django versions
deps =
    pytest
    pytest-asyncio<1.0
    pytest-cov
    pytest-django
    django52: django<5.3,>=5.2
    django60: django<6.1,>=6
commands =
    pytest --cov=django_logging --cov-report=html
develop = True

[testenv:bandit]
description = Run security checks
skip_install = true
deps =
    bandit
commands =
    bandit -r django_logging

[testenv:pre-commit]
description = Run pre-commit hooks
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
