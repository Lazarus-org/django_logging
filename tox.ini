[tox]
requires =
    tox>=4.2
env_list =
    py314-django61
    py314-django60
    py314-django52
    py313-django61
    py313-django60
    py313-django52
    py312-django61
    py312-django60
    py312-django52
    py311-django52
    py310-django52

[testenv]
description = Run the full pytest suite with the selected Python and Django release.
package = editable
deps =
    pytest>=8
    pytest-asyncio<1.0,>=0.24
    pytest-cov>=5
    pytest-django>=4.8
    django52: django<5.3,>=5.2
    django60: django<6.1,>=6
    django61: django<6.2,>=6.1
commands =
    pytest --cov=django_logging --cov-report=term-missing --cov-report=xml:{envtmpdir}/coverage.xml

[testenv:bandit]
description = Run security checks.
skip_install = true
deps =
    bandit[toml]>=1.7
commands =
    bandit -r django_logging -c pyproject.toml

[testenv:pre-commit]
description = Run formatting and static checks.
skip_install = true
deps =
    pre-commit>=3.5
commands =
    pre-commit run --all-files --config=.pre-commit-config-ci.yaml
